[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yyds_logger"
dynamic = ["version", "readme"]
description = "An enhanced logger based on Loguru"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "yyds-fast", email = "yyds.fast@gmail.com"}]

[tool.setuptools.dynamic]
version = {attr = "yyds_logger.__version__.__version__"}
readme = {file = "README.md", content-type = "text/markdown"}

[tool.setuptools.packages.find]
include = ["yyds_logger*"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.6", "mypy>=1.10"]
profile = ["line_profiler>=5.0.2"]
monitoring = ["psutil>=7.2.2"]
all = [
  "line_profiler>=5.0.2",
  "psutil>=7.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["yyds_logger"]

[tool.ruff]
line-length = 120
target-version = "py38"
