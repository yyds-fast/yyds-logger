[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yyds-logger"
dynamic = ["version"]
description = "An enhanced logger based on Loguru"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "yyds-fast", email = "yyds.fast@gmail.com"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Logging",
]
keywords = ["logging", "loguru", "logger", "observability"]

[project.urls]
Source = "https://github.com/yyds-fast/yyds-logger"
Issues = "https://github.com/yyds-fast/yyds-logger/issues"

[tool.setuptools.dynamic]
version = {attr = "yyds_logger.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["yyds_logger*"]

[tool.setuptools.package-data]
"yyds_logger" = ["py.typed"]
"yyds_logger.yyds_loguru" = ["py.typed", "*.pyi"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]
lint = ["ruff>=0.6", "mypy>=1.10,<2"]
profile = ["line_profiler>=5.0.2"]
monitoring = ["psutil>=7.2.2"]
all = [
  "line_profiler>=5.0.2",
  "psutil>=7.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["yyds_logger"]

[tool.coverage.report]
fail_under = 55
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
ignore_missing_imports = true
exclude = "^yyds_logger/yyds_loguru/"

[[tool.mypy.overrides]]
module = [
  "yyds_logger.yyds_loguru.*",
  "yyds_logger.lifecycle",
  "yyds_logger.profiling",
  "yyds_logger.stdlib_bridge",
]
ignore_errors = true
follow_imports = "skip"
