name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Python 3.9 is EOL and missing for Ubuntu 26.04 (ubuntu-latest) in actions/python-versions.
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.9"
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest --cov=yyds_logger --cov-report=term-missing

  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[lint]" build twine
      - run: ruff check .
      - run: mypy yyds_logger
      - run: python -m build
      - run: python -m twine check dist/*
